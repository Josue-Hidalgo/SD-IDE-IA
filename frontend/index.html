<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SD-IDE-IA - Frontend</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">



  <!-- Para el boostrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold" href="#">SD-IDE-IA</a>

  <div class="ms-auto d-none" id="navbarUser">
    <span class="text-white me-3" id="loggedUserName">Profesor</span>
    <button class="btn btn-outline-light btn-sm" onclick="logout()">Cerrar sesión</button>
  </div>
</nav>





<main class="container py-4">

  <!-- LOGIN -->
  <section id="loginSection" class="card-section">
    <h2 class="text-center mb-4">Iniciar sesión</h2>

    <div class="mb-3">
      <label class="form-label">Correo electrónico</label>
      <input type="email" id="loginEmail" class="form-control" placeholder="profesor@correo.com">
    </div>

    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" id="loginPassword" class="form-control" placeholder="Ingrese su contraseña">
    </div>

    <button class="btn btn-primary w-100" onclick="login()">Entrar</button>

    <p class="text-center mt-3">
      ¿No tiene cuenta?
      <a href="#" onclick="showRegister()">Registrarse</a>
    </p>

    <div id="loginMessage" class="mt-3"></div>
  </section>



  <!-- Registro -->
  <section id="registerSection" class="card-section d-none">
    <h2 class="text-center mb-4">Registrar profesor</h2>

    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input type="text" id="registerName" class="form-control" placeholder="Nombre">
    </div>

    <div class="mb-3">
      <label class="form-label">Apellido</label>
      <input type="text" id="registerLastname" class="form-control" placeholder="Apellido">
    </div>

    <div class="mb-3">
      <label class="form-label">Correo electrónico</label>
      <input type="email" id="registerEmail" class="form-control" placeholder="correo@ejemplo.com">
    </div>

    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" id="registerPassword" class="form-control" placeholder="Contraseña">
    </div>

    <button class="btn btn-success w-100" onclick="register()">Crear cuenta</button>

    <p class="text-center mt-3">
      ¿Ya tiene cuenta?
      <a href="#" onclick="showLogin()">Iniciar sesión</a>
    </p>

    <div id="registerMessage" class="mt-3"></div>
  </section>



  <!-- DASHBOARD -->


  <section id="dashboardSection" class="d-none">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2>Panel del profesor</h2>
        <p class="text-muted">Gestión de cursos y tareas</p>
      </div>

      <div>
        <button class="btn btn-outline-primary me-2" onclick="loadCourses()">
          Recargar cursos
        </button>
        <button class="btn btn-primary" onclick="showCreateCourseForm()">
          Crear curso
        </button>
      </div>
    </div>







    <!-- CREAR CURSO -->



    <section id="createCourseSection" class="card-section d-none">
      <h4 class="mb-3">Crear curso</h4>

      <div class="mb-3">
        <label class="form-label">Código del curso</label>
        <input type="text" id="courseCode" class="form-control" placeholder="Ejemplo: IC2101">
      </div>

      <div class="mb-3">
        <label class="form-label">Nombre del curso</label>
        <input type="text" id="courseName" class="form-control" placeholder="Ejemplo: Programación Orientada a Objetos">
      </div>

      <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea id="courseDescription" class="form-control" rows="3"></textarea>
      </div>

      <button class="btn btn-success" onclick="createCourse()">Guardar curso</button>
      <button class="btn btn-secondary" onclick="hideCreateCourseForm()">Cancelar</button>

      <div id="courseMessage" class="mt-3"></div>
    </section>





    <!-- CURSOS -->

    <section class="card-section">
      <h4>Mis cursos</h4>
      <p class="text-muted">Seleccione un curso para asignar tareas.</p>

      <div id="coursesContainer" class="row g-3"></div>
    </section>

    <!-- ASIGNAR TAREA -->
    <section id="assignmentSection" class="card-section d-none">
      <h4 id="assignmentCourseTitle">Asignar tarea</h4>

      <div class="row">
        <div class="col-md-6">
          <h5>Nueva tarea</h5>

          <div class="mb-3">
            <label class="form-label">Nombre de la tarea</label>
            <input type="text" id="assignmentName" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea id="assignmentDescription" class="form-control" rows="3"></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Fecha límite</label>
            <input type="datetime-local" id="assignmentDeadline" class="form-control">
          </div>

          <div class="form-check mb-3">
            <input type="checkbox" id="assignmentAllowed" class="form-check-input">
            <label class="form-check-label">
              Permitir entrega después de la fecha límite
            </label>
          </div>

          <button id="assignmentSubmitButton" class="btn btn-success" onclick="createAssignment()">
            Guardar tarea
          </button>
          <button id="cancelEditAssignmentButton" class="btn btn-secondary d-none" onclick="resetAssignmentForm()">
            Cancelar edición
          </button>

          <div id="assignmentMessage" class="mt-3"></div>
        </div>

        <div class="col-md-6">
          <div class="tasks-box">
            <h5>Tareas registradas</h5>
            <div id="assignmentsContainer"></div>
          </div>
        </div>
      </div>
    </section>

  </section>

</main>






<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="main.js"></script>

</body>
</html>
